<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#fff;font-family:'Hanken Grotesk',sans-serif;color:#111}
.band{background:#ffd200;padding:18px 20px 16px;border-bottom:4px solid #111}
.band small{font-weight:600;font-size:13px}.band h1{font-size:30px;font-weight:800;line-height:1.05;margin-top:4px}
.chain{display:flex;gap:8px;padding:16px 20px;align-items:center}
.code{font-weight:800;font-size:44px;letter-spacing:-.02em}.arr{font-size:28px}
.sub{padding:0 20px 12px;color:#444}
.search{margin:0 20px;border:3px solid #111;padding:12px;font-size:17px}
.row{display:flex;align-items:center;gap:12px;margin:0 20px;padding:14px 0;border-bottom:2px solid #111}
.pic{width:34px;height:34px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}
.row b{font-size:19px}.row span{margin-left:auto;font-weight:600}
.cta{position:absolute;left:20px;right:20px;bottom:22px;background:#111;color:#ffd200;font-weight:800;text-align:center;padding:16px;font-size:17px}
</style></head><body>
<div class="band"><small>Costa con el parche · step 3 of 4</small><h1>Where to after Cartagena?</h1></div>
<div class="chain"><span class="code">BOG</span><span class="arr">→</span><span class="code">CTG</span><span class="arr">→</span><span class="code" style="color:#bbb">?</span></div>
<p class="sub">Pick a city. You can add more stops after.</p>
<div class="search">San|</div>
<div class="row"><span class="pic">SMR</span><b>Santa Marta</b><span>→</span></div>
<div class="row"><span class="pic">ADZ</span><b>San Andrés</b><span>→</span></div>
<div class="row"><span class="pic">SGL</span><b>San Gil</b><span>→</span></div>
<div class="cta">That's the whole route</div>
</body></html>
