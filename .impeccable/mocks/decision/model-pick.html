<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#fff;font-family:Onest,sans-serif;color:#141414}
header{display:flex;justify-content:space-between;padding:18px 20px;font-weight:600}
.logo{font-family:'Barlow Condensed';font-weight:800;font-size:24px;color:#e4007c}
h1{font-family:'Barlow Condensed';font-weight:800;font-size:40px;line-height:.95;padding:0 20px 6px;text-transform:uppercase}
.sub{padding:0 20px 18px;color:#555}
.line{position:relative;margin:0 20px;padding-left:44px}
.line:before{content:"";position:absolute;left:14px;top:12px;bottom:170px;width:10px;background:#e4007c;border-radius:5px}
.st{position:relative;padding:8px 0 22px}
.st:before{content:"";position:absolute;left:-38px;top:8px;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid #141414}
.st b{font-family:'Barlow Condensed';font-weight:800;font-size:28px;text-transform:uppercase;display:block;line-height:1}
.st span{color:#555;font-size:14px}
.open:before{border-style:dashed;border-color:#e4007c}
.search{border:2px solid #141414;border-radius:8px;padding:11px 12px;font-size:16px;margin-top:6px}
.opt{padding:10px 2px;border-bottom:1px solid #e5e5e5;display:flex;justify-content:space-between}.opt small{color:#666}
.cta{position:absolute;left:20px;right:20px;bottom:22px;background:#141414;color:#fff;text-align:center;padding:16px;border-radius:999px;font-weight:600}
</style></head><body>
<header><span class="logo">PARCHE</span><span>Cancel</span></header>
<h1>Costa con<br>el parche</h1><p class="sub">Each city is a stop on your line.</p>
<div class="line">
 <div class="st"><b>Bogotá</b><span>Takeoff · Mar 3</span></div>
 <div class="st"><b>Cartagena</b><span>Mar 3–8 · 5 nights</span></div>
 <div class="st open"><span style="font-weight:600;color:#141414">Next stop</span>
  <div class="search">San|</div>
  <div class="opt"><span>Santa Marta</span><small>Colombia</small></div>
  <div class="opt"><span>San Andrés</span><small>Colombia</small></div>
  <div class="opt"><span>San Gil</span><small>Colombia</small></div></div>
</div>
<div class="cta">Create trip</div>
</body></html>
