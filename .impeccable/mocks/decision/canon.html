<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#f3f4f6;font-family:Onest,sans-serif;color:#111827}
.map{height:200px;background:linear-gradient(135deg,#dbeafe,#e0f2fe);position:relative}
.map i{position:absolute;width:14px;height:14px;border-radius:50%;background:#2563eb;border:3px solid #fff}
h1{font-size:24px;font-weight:700;padding:16px 16px 4px}.sub{padding:0 16px 12px;color:#6b7280}
.card{background:#fff;margin:0 16px 10px;border-radius:12px;padding:14px;display:flex;justify-content:space-between;box-shadow:0 1px 3px #0001}
.card small{color:#6b7280}.search{margin:4px 16px;background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:12px}
.opt{margin:0 16px;background:#fff;padding:12px;border-bottom:1px solid #eee}
.cta{position:absolute;left:16px;right:16px;bottom:22px;background:#2563eb;color:#fff;text-align:center;padding:15px;border-radius:12px;font-weight:600}
</style></head><body>
<div class="map"><i style="left:150px;top:150px"></i><i style="left:120px;top:40px"></i></div>
<h1>Costa con el parche</h1><p class="sub">Add destinations</p>
<div class="card"><b>Bogotá</b><small>Mar 3</small></div>
<div class="card"><b>Cartagena</b><small>Mar 3–8</small></div>
<div class="search">San|</div>
<div class="opt">Santa Marta</div><div class="opt">San Andrés</div><div class="opt">San Gil</div>
<div class="cta">Save trip</div>
</body></html>
